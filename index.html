<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Model Jam & Slot Waktu Sekolah</title>
<style>
  :root{
    --bg:#f6f5f1; --card:#ffffff; --ink:#1f2421; --muted:#6b7269;
    --accent:#0f6a4f; --accent-soft:#e6f2ec; --line:#e4e1d8;
    --istirahat-bg:#fff3d6; --istirahat-ink:#8a5a00;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);padding:24px 16px 60px;}
  .wrap{max-width:1000px;margin:0 auto;}
  h1{font-size:1.4rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:20px;}
  .controls{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px;
    background:var(--card); padding:18px; border-radius:12px; border:1px solid var(--line);
    margin-bottom:18px;
  }
  .field{display:flex;flex-direction:column;gap:4px;}
  label{font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
  select,input{padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:.92rem;background:#fff;color:var(--ink);}
  .day-toggles{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1;}
  .day-chip{
    padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;
    font-size:.8rem;cursor:pointer;user-select:none;
  }
  .day-chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .day-jp{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .day-jp .field{width:110px;}
  .btn{
    background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:8px;
    font-size:.9rem;cursor:pointer;font-weight:600;
  }
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .card h3{margin:0 0 10px;font-size:.95rem;display:flex;justify-content:space-between;align-items:center;}
  .card h3 .total{font-size:.72rem;color:var(--muted);font-weight:500;}
  table{width:100%;border-collapse:collapse;font-size:.82rem;}
  td,th{padding:5px 4px;text-align:left;border-bottom:1px solid var(--line);}
  tr.istirahat td{background:var(--istirahat-bg);color:var(--istirahat-ink);font-weight:600;font-size:.75rem;}
  td.jam{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums;}
  .export-box{margin-top:20px;}
  .export-box textarea{
    width:100%;height:160px;font-family:'Consolas',monospace;font-size:.78rem;
    padding:10px;border-radius:8px;border:1px solid var(--line);background:#fbfaf5;color:var(--ink);
  }
  .note{font-size:.8rem;color:var(--muted);margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Model Jam & Slot Waktu</h1>
  <div class="sub">Atur jam mulai, durasi JP, dan 2x waktu istirahat secara dinamis.</div>

  <div class="controls">
    <div class="field">
      <label>Jam Mulai</label>
      <input type="time" id="jamMulai" value="07:00">
    </div>
    <div class="field">
      <label>Jenjang (1 JP)</label>
      <select id="jenjang">
        <option value="35">MI — 35 menit</option>
        <option value="40" selected>MTs — 40 menit</option>
        <option value="45">MA — 45 menit</option>
      </select>
    </div>
    
    <!-- Istirahat 1 -->
    <div class="field">
      <label>Istirahat 1: Setelah JP</label>
      <input type="number" id="posisiIstirahat1" value="4" min="1" max="12">
    </div>
    <div class="field">
      <label>Durasi Istirahat 1 (mnt)</label>
      <input type="number" id="durasiIstirahat1" value="15" min="5" max="60">
    </div>

    <!-- Istirahat 2 -->
    <div class="field">
      <label>Istirahat 2: Setelah JP</label>
      <input type="number" id="posisiIstirahat2" value="6" min="0" max="12" placeholder="0 = nonaktif">
    </div>
    <div class="field">
      <label>Durasi Istirahat 2 (mnt)</label>
      <input type="number" id="durasiIstirahat2" value="20" min="0" max="60">
    </div>

    <div class="day-toggles">
      <label style="width:100%;">Hari Aktif</label>
      <div class="day-chip active" data-day="Senin">Senin</div>
      <div class="day-chip active" data-day="Selasa">Selasa</div>
      <div class="day-chip active" data-day="Rabu">Rabu</div>
      <div class="day-chip active" data-day="Kamis">Kamis</div>
      <div class="day-chip active" data-day="Jumat">Jumat</div>
      <div class="day-chip" data-day="Sabtu">Sabtu</div>
      <div class="day-chip" data-day="Minggu">Minggu</div>
    </div>

    <div class="day-jp" id="dayJpInputs"></div>

    <div style="grid-column:1/-1;">
      <button class="btn" id="btnGenerate">Generate Slot</button>
    </div>
  </div>

  <div class="grid" id="output"></div>

  <div class="export-box">
    <label style="font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;">Export JSON (untuk dipakai mesin penjadwalan)</label>
    <textarea id="exportArea" readonly></textarea>
  </div>
</div>

<script>
const dayJpContainer = document.getElementById('dayJpInputs');
const output = document.getElementById('output');
const exportArea = document.getElementById('exportArea');

// Default JP per day
const defaultJp = {Senin:8, Selasa:8, Rabu:8, Kamis:8, Jumat:6, Sabtu:6, Minggu:6};

function buildDayJpInputs(){
  dayJpContainer.innerHTML = '';
  getActiveDays().forEach(day => {
    const div = document.createElement('div');
    div.className = 'field';
    div.innerHTML = `<label>JP ${day}</label><input type="number" class="jp-count" data-day="${day}" min="1" max="14" value="${defaultJp[day] || 8}">`;
    dayJpContainer.appendChild(div);
  });
}

function getActiveDays(){
  return Array.from(document.querySelectorAll('.day-chip.active')).map(el => el.dataset.day);
}

document.querySelectorAll('.day-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    chip.classList.toggle('active');
    buildDayJpInputs();
  });
});

function addMinutes(hhmm, mins){
  const [h,m] = hhmm.split(':').map(Number);
  const total = h*60 + m + mins;
  const nh = Math.floor(total/60) % 24;
  const nm = total % 60;
  return String(nh).padStart(2,'0') + ':' + String(nm).padStart(2,'0');
}

function generateDaySlots(startTime, jpCount, jpDurasi, posIst1, durIst1, posIst2, durIst2){
  let current = startTime;
  const slots = [];
  
  for(let i=1; i<=jpCount; i++){
    const mulai = current;
    const selesai = addMinutes(current, jpDurasi);
    slots.push({tipe:'jp', jp_ke:i, mulai, selesai});
    current = selesai;
    
    // Cek apakah ada Istirahat 1 di posisi JP ini (dan bukan di jam pulang)
    if(i === posIst1 && i < jpCount && durIst1 > 0){
      const istMulai = current;
      const istSelesai = addMinutes(current, durIst1);
      slots.push({tipe:'istirahat', label:'ISTIRAHAT 1', mulai:istMulai, selesai:istSelesai});
      current = istSelesai;
    }
    
    // Cek apakah ada Istirahat 2 di posisi JP ini (dan bukan di jam pulang)
    if(i === posIst2 && i < jpCount && durIst2 > 0){
      const istMulai = current;
      const istSelesai = addMinutes(current, durIst2);
      slots.push({tipe:'istirahat', label:'ISTIRAHAT 2', mulai:istMulai, selesai:istSelesai});
      current = istSelesai;
    }
  }
  return slots;
}

function render(){
  const jamMulai = document.getElementById('jamMulai').value;
  const jpDurasi = Number(document.getElementById('jenjang').value);
  
  const posIst1 = Number(document.getElementById('posisiIstirahat1').value);
  const durIst1 = Number(document.getElementById('durasiIstirahat1').value);
  
  const posIst2 = Number(document.getElementById('posisiIstirahat2').value);
  const durIst2 = Number(document.getElementById('durasiIstirahat2').value);

  const days = getActiveDays();
  const scheduleModel = { jam_mulai: jamMulai, jp_menit: jpDurasi, hari: {} };

  output.innerHTML = '';
  
  days.forEach(day => {
    const jpInput = document.querySelector(`.jp-count[data-day="${day}"]`);
    const jpCount = jpInput ? Number(jpInput.value) : 8;
    
    const slots = generateDaySlots(jamMulai, jpCount, jpDurasi, posIst1, durIst1, posIst2, durIst2);

    scheduleModel.hari[day] = slots.map(s => ({
      ...s,
      id: s.tipe === 'jp' ? `${day}-${s.jp_ke}` : `${day}-istirahat-${s.mulai}`
    }));

    // Menghitung total waktu aktual (durasi JP + durasi istirahat yang benar-benar masuk)
    let totalDurasiIstirahat = 0;
    if (posIst1 > 0 && posIst1 < jpCount) totalDurasiIstirahat += durIst1;
    if (posIst2 > 0 && posIst2 < jpCount) totalDurasiIstirahat += durIst2;
    
    const totalMenit = (jpCount * jpDurasi) + totalDurasiIstirahat;

    const card = document.createElement('div');
    card.className = 'card';
    
    const rows = slots.map(s => s.tipe === 'jp'
      ? `<tr><td class="jam">${s.mulai}–${s.selesai}</td><td>JP ke-${s.jp_ke}</td></tr>`
      : `<tr class="istirahat"><td class="jam">${s.mulai}–${s.selesai}</td><td>${s.label}</td></tr>`
    ).join('');
    
    card.innerHTML = `
      <h3>${day} <span class="total">${jpCount} JP · ~${Math.round(totalMenit/60*10)/10} jam</span></h3>
      <table>${rows}</table>
    `;
    output.appendChild(card);
  });

  exportArea.value = JSON.stringify(scheduleModel, null, 2);
}

document.getElementById('btnGenerate').addEventListener('click', render);
document.getElementById('jenjang').addEventListener('change', render);

buildDayJpInputs();
render();
</script>
</body>
</html>
